<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macropad · Vista live</title>
<style>
@font-face { font-family: "Google Sans"; src: url("fonts/GoogleSans-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }

/* Linguaggio visivo v3 — tre strati
   1) ambiente: campo di punti reattivo + luce LED sotto il pad
   2) il pad, ridisegnato sulle foto del prodotto reale (sagoma, posizioni, materiali)
   3) strumenti: barra in alto, barra di stato in basso, ispettore ancorato. Superfici sobrie, raggi piccoli,
      filetti da 1 px, tipografia Google Sans con micro‑etichette in maiuscolo. Un solo accento (blu di sistema). */
:root {
  color-scheme: light dark;
  --bg: #e6e7eb;
  --aurora-op: .22;
  --dot-rgb: 0,0,0;
  --accent-rgb: 0,113,227;
  --accent: #0071e3;
  --text: #15161a;
  --muted: #5b5e66;
  --faint: #8d9098;
  --panel: rgba(247,247,249,.74);
  --panel-solid: #f3f3f5;
  --spec: rgba(255,255,255,.75);
  --hair: rgba(20,22,28,.10);
  --hair-strong: rgba(20,22,28,.24);
  --fill: rgba(20,22,28,.055);
  --seg-on: #ffffff;
  --ok: #2b9a4a;
  --warn: #c76a00;
  --shadow: 0 0 0 .5px rgba(0,0,0,.10), 0 14px 34px -12px rgba(0,0,0,.30);
  --led: #34d86b;
  --under-op: .30;
  /* materiali del pad (oggetto fisico: identici nei due temi, leggermente attenuati di notte) */
  --plate-1: #bcc2ca;
  --plate-2: #98a0aa;
  --cap-face: #0b0c0f;
  --font: "Google Sans", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #09090b;
    --aurora-op: .46;
    --dot-rgb: 255,255,255;
    --accent-rgb: 41,151,255;
    --accent: #2997ff;
    --text: #ededf0;
    --muted: #9b9da5;
    --faint: #65676e;
    --panel: rgba(18,19,23,.66);
    --panel-solid: #1c1d21;
    --spec: rgba(255,255,255,.07);
    --hair: rgba(255,255,255,.085);
    --hair-strong: rgba(255,255,255,.20);
    --fill: rgba(255,255,255,.06);
    --seg-on: #3b3c42;
    --ok: #30d158;
    --warn: #ff9f0a;
    --shadow: 0 0 0 .5px rgba(0,0,0,.6), 0 18px 44px -14px rgba(0,0,0,.65);
    --under-op: .26;
    --plate-1: #9aa1ab;
    --plate-2: #747b86;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--bg); color: var(--text);
  font: 400 14.5px/1.45 var(--font); letter-spacing: -.008em; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
button { font: inherit; letter-spacing: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.micro { font: 700 11px/1 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ——— 1: ambiente ——— */
#bg { position: fixed; inset: 0; z-index: 0; }
#bg, #aurora { user-select: none; }

/* ——— superfici degli strumenti ——— */
.glass {
  background: var(--panel);
  -webkit-backdrop-filter: blur(22px) saturate(165%); backdrop-filter: blur(22px) saturate(165%);
  border: 1px solid var(--hair);
  box-shadow: inset 0 1px 0 var(--spec), var(--shadow);
}
.glass.refract { -webkit-backdrop-filter: var(--rf) blur(4px) saturate(165%); backdrop-filter: var(--rf) blur(4px) saturate(165%); }
/* filo luminoso: chiaro in alto a sinistra, tenue al centro, accento in basso a sinistra */
.glass { position: relative; }
.glass::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(135deg, rgba(255,255,255,.34), rgba(255,255,255,.05) 38%, rgba(255,255,255,.04) 62%, rgba(var(--accent-rgb), .42));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
@media (prefers-color-scheme: light) { .glass::before { background: linear-gradient(135deg, rgba(255,255,255,.9), rgba(255,255,255,.2) 40%, rgba(0,0,0,.05) 70%, rgba(var(--accent-rgb), .35)); } }
#aurora { position: fixed; z-index: 0; left: -10vw; right: -10vw; bottom: -26vh; height: 62vh; pointer-events: none; opacity: var(--aurora-op); filter: blur(46px);
  background:
    radial-gradient(52% 70% at 22% 88%, color-mix(in srgb, var(--led) 80%, transparent), transparent 72%),
    radial-gradient(46% 62% at 72% 100%, color-mix(in srgb, var(--accent) 70%, transparent), transparent 72%),
    radial-gradient(34% 48% at 48% 112%, color-mix(in srgb, var(--led) 60%, var(--accent)), transparent 72%);
  animation: drift 22s ease-in-out infinite alternate; }
@keyframes drift { from { transform: translate3d(-3%, 0, 0) scaleY(1); } to { transform: translate3d(3%, -2%, 0) scaleY(1.14); } }
@media (prefers-reduced-motion: reduce) { #aurora { animation: none; } }
@media (prefers-reduced-transparency: reduce) {
  .glass, .glass.refract { background: var(--panel-solid); -webkit-backdrop-filter: none; backdrop-filter: none; }
}
@media (prefers-contrast: more) { .glass { border-color: var(--hair-strong); } }

/* pannelli flottanti — forme a pillola, superfici scure con filo luminoso (riferimento: Stitch) */
.fl { position: fixed; z-index: 5; }
.pill { border-radius: 999px; }
.brand { position: fixed; z-index: 5; top: 17px; left: 24px; display: flex; align-items: center; gap: 12px; font-weight: 500; font-size: 22px; letter-spacing: -.028em; }
.brand .mark { width: 20px; height: 20px; flex: none; }
.brand .mark circle { fill: var(--text); }
.brand .mark circle:nth-child(5) { fill: var(--accent); }
.tagpill { font-size: 11px; font-weight: 600; letter-spacing: .07em; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--hair-strong); color: var(--text); }
.layers { top: 13px; left: 50%; transform: translateX(-50%); padding: 5px; }
.seg { display: inline-flex; gap: 2px; }
.seg button { white-space: nowrap; border: 0; background: transparent; padding: 9px 19px; border-radius: 999px; font-size: 14.5px; font-weight: 500; color: var(--muted); transition: background .15s, color .15s; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--text); box-shadow: 0 0 0 1px var(--hair-strong); }
.topright { position: fixed; z-index: 5; top: 13px; right: 16px; display: flex; align-items: center; gap: 10px; }
.topright .fl { position: static; }
.ledcard { display: flex; align-items: center; gap: 14px; padding: 12px 18px; }
.ledcard .item { display: inline-flex; align-items: center; gap: 8px; color: var(--faint); font-size: 14px; font-weight: 500; white-space: nowrap; }
.ledcard .item i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1px var(--hair-strong); opacity: .55; }
.ledcard .item > span { display: none; }
.ledcard .item.on > span { display: inline; }
.ledcard .item.on { color: var(--text); font-weight: 600; }
.ledcard .item.on i { opacity: 1; box-shadow: 0 0 0 1px rgba(0,0,0,.25), 0 0 11px 2px var(--c); }
.cta { display: inline-flex; align-items: center; border: 0; cursor: pointer; font-family: inherit; padding: 12px 22px; border-radius: 999px; background: #15161a; color: #fff; font-size: 14.5px; font-weight: 500; letter-spacing: -.01em; text-decoration: none; box-shadow: 0 8px 22px -10px rgba(0,0,0,.5); transition: transform .12s, background .12s; }
.cta svg { display: none; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; }
.cta:hover { text-decoration: none; transform: translateY(-1px); background: #000; }
@media (prefers-color-scheme: dark) { .cta { background: #fff; color: #0b0b0d; box-shadow: 0 8px 26px -10px rgba(255,255,255,.4); } .cta:hover { background: #ececf0; } }
.conncard { left: 16px; bottom: 18px; display: flex; align-items: center; gap: 18px; padding: 12px 20px; }
.chip { display: inline-flex; align-items: center; gap: 9px; color: var(--text); white-space: nowrap; font-size: 14px; font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.chip.ok .dot { background: var(--ok); box-shadow: 0 0 0 3px rgba(48,209,88,.18); }
.chip.warn .dot { background: var(--warn); box-shadow: 0 0 0 3px rgba(255,159,10,.18); }
.recents { position: fixed; z-index: 5; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; max-width: min(780px, calc(100vw - 1040px)); }
.rchip { display: inline-flex; align-items: center; gap: 9px; padding: 11px 18px; border-radius: 999px; color: var(--muted); font-size: 14px; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; position: relative; }
.rchip b { font-weight: 600; }
.rchip span { color: var(--muted); font-weight: 400; overflow: hidden; text-overflow: ellipsis; }
.rchip .n { font-weight: 600; color: var(--accent); }
.rchip.now { color: var(--text); }
.textbtn { right: 16px; bottom: 18px; padding: 12px 20px; font-size: 14px; font-weight: 500; color: var(--muted); }
.textbtn:hover, .textbtn[aria-expanded="true"] { color: var(--text); }
.textbtn svg { display: none; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; }

/* palcoscenico */
.stage { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; padding: 70px 16px 70px; }
svg#pad { height: min(calc(100vh - 220px), 700px); width: auto; max-width: 100%; overflow: visible; user-select: none; -webkit-user-select: none; touch-action: none; }

/* ispettore ancorato */
.card { position: fixed; z-index: 6; width: 332px; border-radius: 26px; padding: 22px 22px 18px; opacity: 0; transform: translateY(6px); transition: opacity .16s, transform .24s cubic-bezier(.2,.8,.2,1); }
.card.in { opacity: 1; transform: none; }
.card header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.card h2 { margin: 8px 0 0; font-size: 32px; font-weight: 500; letter-spacing: -.035em; line-height: 1.06; }
.card .x { width: 34px; height: 34px; margin: -8px -10px 0 0; border-radius: 50%; border: 0; background: none; color: var(--muted); font-size: 15px; display: grid; place-items: center; }
.card .x:hover { background: var(--fill); color: var(--text); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.badge { padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; background: var(--fill); color: var(--text); }
.badge.acc { background: rgba(var(--accent-rgb), .18); color: var(--accent); }
.sec { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--hair); }
.sec > .micro { display: block; margin-bottom: 11px; }
.big { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; min-height: 42px; font-size: 28px; font-weight: 500; letter-spacing: -.03em; line-height: 1.12; }
.big .none { font-size: 17px; font-weight: 500; }
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { display: grid; grid-template-columns: 112px 1fr; align-items: center; gap: 12px; min-height: 46px; border-bottom: 1px solid var(--hair); }
.rows li:last-child { border-bottom: 0; }
.rows .k { font-size: 14px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.rows .v { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; font-size: 16.5px; font-weight: 600; letter-spacing: -.015em; }
.rows li.cur .k { color: var(--accent); }
.rows .none { color: var(--faint); font-weight: 500; }
.rows .tail, .big .tail { color: var(--muted); font-weight: 500; margin-left: 2px; }
kbd { font: 600 14.5px/1 var(--font); padding: 7px 11px; border-radius: 10px; background: var(--fill); border: 1px solid var(--hair-strong); border-bottom-width: 2px; color: var(--text); letter-spacing: 0; }
.big kbd { font-size: 20px; padding: 9px 15px; border-radius: 13px; }
.plus { color: var(--faint); font-size: 14px; font-style: normal; font-weight: 500; }
.note { margin: 16px 0 0; padding: 12px 14px; border-radius: 18px; background: rgba(255,159,10,.12); border: 1px solid rgba(255,159,10,.35); color: var(--text); font-size: 13.5px; line-height: 1.45; }
.note b { display: block; font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.foot { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--hair); font-size: 14px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
#link { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
#link path { fill: none; stroke: var(--hair-strong); stroke-width: 1.2; stroke-dasharray: 2 3; }
#link circle { fill: var(--accent); }

/* etichette temporanee sul pad */
#tags { position: fixed; inset: 0; z-index: 7; pointer-events: none; }
.tag { position: fixed; padding: 8px 15px; border-radius: 999px; font-size: 14.5px; font-weight: 600; letter-spacing: -.012em; white-space: nowrap; opacity: 0; transition: opacity .14s, transform .22s cubic-bezier(.2,.8,.2,1); }
.tag.up { transform: translate(-50%, -100%) translateY(5px); }
.tag.up.on { opacity: 1; transform: translate(-50%, -100%) translateY(-2px); }
.tag.left { transform: translate(-100%, -50%) translateX(5px); }
.tag.left.on { opacity: 1; transform: translate(-100%, -50%) translateX(-2px); }

.sheet { position: fixed; z-index: 6; right: 16px; bottom: 74px; width: min(460px, calc(100vw - 32px)); border-radius: 26px; padding: 20px 22px; }
.sheet h3 { margin: 8px 0 4px; font-size: 22px; font-weight: 500; letter-spacing: -.025em; }
.sheet p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
.sheet pre { margin: 0 0 14px; padding: 12px 14px; border-radius: 16px; background: var(--fill); border: 1px solid var(--hair); font: 12px/1.6 var(--mono); max-height: 230px; overflow: auto; }
.sheet .btn { border: 1px solid var(--hair-strong); background: var(--fill); padding: 8px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; }




/* ——— 2: il pad ——— */
#pad .shadow { fill: rgba(0,0,0,.42); filter: blur(26px); }
#pad .under { fill: var(--led); opacity: calc(var(--under-op) * .35); filter: blur(46px); transition: opacity .25s; }
#pad .stack-base { fill: #0c0c0d; }
#pad .stack-pcb { fill: #14181a; }
#pad .stack-clear { fill: var(--led); fill-opacity: .34; stroke: #fff; stroke-opacity: .4; stroke-width: 1.5; transition: fill .25s; }
#pad .edge-glow { fill: none; stroke: var(--led); stroke-width: 40; opacity: .36; filter: blur(14px); }
#pad .edge-line { fill: none; stroke: var(--led); stroke-width: 5; opacity: .72; }
#pad .frost { fill: url(#plate); }
#pad .frost-edge { fill: none; stroke: url(#plateEdge); stroke-width: 4; }
#pad .under-plate { fill: #fff; opacity: .34; }
#pad .under-plate.out { fill: none; stroke: #20252b; stroke-opacity: .16; stroke-width: 2; opacity: 1; }
#pad .led-pill { fill: #fff; fill-opacity: .22; stroke: #fff; stroke-opacity: .5; stroke-width: 2; }
#pad .led { fill: #6c7178; fill-opacity: .55; transition: fill .15s; }
#pad .led.on { fill: var(--led); fill-opacity: 1; filter: drop-shadow(0 0 7px var(--led)); }
#pad .led-n { fill: #11151a; fill-opacity: .65; font: 700 17px var(--font); }
#pad .screw-bg { fill: url(#chrome); stroke: rgba(0,0,0,.45); stroke-width: 1.5; }
#pad .screw-x { stroke: rgba(30,32,36,.75); stroke-width: 3.2; stroke-linecap: round; }

#pad .k-shadow { fill: rgba(0,0,0,.34); filter: blur(7px); }
#pad .k-led { fill: var(--led); opacity: .42; filter: blur(20px); transition: opacity .12s; }
#pad .key.down .k-led { opacity: .85; }
#pad .k-base { fill: #08090b; stroke: #08090b; stroke-width: 12; stroke-linejoin: round; }
#pad .k-base-hl { fill: none; stroke: rgba(255,255,255,.10); stroke-width: 2; stroke-linejoin: round; }
#pad .k-face { fill: var(--cap-face); }
#pad .k-lip { fill: none; stroke: rgba(200,214,235,.26); stroke-width: 3; stroke-linecap: round; }
#pad .k-lip-sh { fill: none; stroke: rgba(0,0,0,.55); stroke-width: 5; stroke-linecap: round; }
#pad .k-bevel { fill: none; stroke: url(#faceBevel); stroke-width: 3; }
#pad .k-edge { fill: none; stroke: rgba(255,255,255,.07); stroke-width: 2; }
#pad .k-glow { fill: var(--accent); opacity: 0; transition: opacity .09s; }
#pad .k-label { fill: rgba(255,255,255,.94); font-family: var(--font); font-weight: 700; letter-spacing: -.015em; text-anchor: middle; pointer-events: none; }
#pad .k-num { fill: rgba(255,255,255,.36); font: 700 17px var(--font); pointer-events: none; }
#pad .k-top { transition: transform .075s cubic-bezier(.3,.7,.4,1); transform-box: fill-box; transform-origin: center; }
#pad .key { cursor: pointer; outline: none; }
#pad .key.down .k-top { transform: translateY(9px) scale(.97); }
#pad .key.down .k-glow { opacity: .30; }
#pad .k-sel { fill: none; stroke: var(--accent); stroke-width: 4; opacity: 0; transition: opacity .15s; }
#pad .key.sel .k-sel, #pad .key:focus-visible .k-sel { opacity: 1; }

#pad .n-shadow { fill: rgba(0,0,0,.38); filter: blur(12px); }
#pad .n-skirt { fill: url(#skirt); }
#pad .n-rib { stroke: rgba(222,228,236,.62); stroke-width: 3.4; stroke-linecap: round; }
#pad .n-bezel { fill: url(#bezel); }
#pad .n-bezel-hl { fill: none; stroke: url(#bezelHl); stroke-width: 6; }
#pad .n-step { fill: #08080a; stroke: rgba(255,255,255,.07); stroke-width: 2; }
#pad .n-disc-bg { fill: #0b0c0e; }
#pad .n-ring { fill: none; stroke: url(#chrome); stroke-width: 6; transition: stroke .1s; }
#pad .n-mark { stroke: #f6f6f3; stroke-linecap: round; }
#pad .n-spin { transition: transform .13s cubic-bezier(.3,.7,.4,1); }
#pad .n-body { transition: transform .08s ease-out; transform-box: fill-box; transform-origin: center; }
#pad .knob { cursor: pointer; outline: none; }
#pad .knob.down .n-body { transform: translateY(6px) scale(.97); }
#pad .knob.down .n-ring, #pad .knob.turn .n-ring { stroke: var(--accent); }
#pad .n-sel { fill: none; stroke: var(--accent); stroke-width: 4; opacity: 0; transition: opacity .15s; }
#pad .knob.sel .n-sel, #pad .knob:focus-visible .n-sel { opacity: 1; }
#pad .n-arrow { fill: var(--accent); font: 600 56px var(--font); text-anchor: middle; opacity: 0; pointer-events: none; }
#pad .n-arrow.go { animation: arrow .5s ease-out; }
@keyframes arrow { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }
/* stato del collegamento, fogli di invio e LED */
.linkpill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px 4px 9px; border-radius: 999px; border: 1px solid var(--hair-strong); font-size: 12.5px; font-weight: 600; letter-spacing: .01em; color: var(--text); white-space: nowrap; }
.linkpill .dot { width: 8px; height: 8px; }
.linkpill.usb .dot, .linkrow.usb .dot { background: #30d158; box-shadow: 0 0 0 3px rgba(48,209,88,.2); }
.linkpill.ble .dot, .linkrow.ble .dot { background: #2997ff; box-shadow: 0 0 0 3px rgba(41,151,255,.22); }
.linkpill.off .dot, .linkrow.off .dot { background: #ff453a; box-shadow: 0 0 0 3px rgba(255,69,58,.2); }
.linkpill.unknown .dot { background: var(--faint); }
#ledCard { cursor: pointer; }
.sh { display: flex; align-items: center; justify-content: space-between; }
.x2 { width: 30px; height: 30px; margin: -6px -8px 0 0; border: 0; border-radius: 50%; background: none; color: var(--muted); font-size: 14px; display: grid; place-items: center; }
.x2:hover { background: var(--fill); color: var(--text); }
.tags2 { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
.tg { padding: 5px 11px; border-radius: 999px; background: var(--fill); border: 1px solid var(--hair); font-size: 13px; font-weight: 500; }
.tg.more { color: var(--muted); }
.linkrow { display: flex; align-items: center; gap: 9px; margin: 6px 0 14px; font-size: 14px; font-weight: 500; }
.linkrow .dot { background: var(--faint); }
.prog { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
.bar { height: 6px; border-radius: 999px; background: var(--fill); overflow: hidden; margin-bottom: 6px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .2s; }
.okmark { width: 44px; height: 44px; border-radius: 50%; background: rgba(48,209,88,.16); color: #30d158; display: grid; place-items: center; font-size: 24px; font-weight: 700; margin: 10px 0 8px; }
.row2.actions { margin-top: 4px; justify-content: space-between; }
.swatches { display: flex; flex-wrap: nowrap; justify-content: space-between; gap: 8px; margin: 2px 0 6px; }
.sw { flex: 0 1 34px; min-width: 22px; aspect-ratio: 1; padding: 0; border-radius: 50%; border: 2px solid transparent; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.28); }
.swatches.dim .sw { opacity: .35; }
.sw.x { --c: var(--fill); font-size: 11px; font-weight: 700; color: var(--muted); border: 1px dashed var(--hair-strong); display: grid; place-items: center; }
.sw.x[aria-pressed="true"] { color: var(--text); }
