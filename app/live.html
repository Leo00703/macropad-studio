<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macropad · Vista live</title>
<link rel="stylesheet" href="live.css">
</head>
<body>
<div id="aurora" aria-hidden="true"></div>
<canvas id="bg" aria-hidden="true"></canvas>

<div class="brand">
  <svg class="mark" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="3" r="1.6"/><circle cx="8" cy="3" r="1.6"/><circle cx="13" cy="3" r="1.6"/><circle cx="3" cy="8" r="1.6"/><circle cx="8" cy="8" r="1.6"/><circle cx="13" cy="8" r="1.6"/><circle cx="3" cy="13" r="1.6"/><circle cx="8" cy="13" r="1.6"/><circle cx="13" cy="13" r="1.6"/></svg>
  <b>Macropad</b><span class="tagpill">LIVE</span>
  <span class="linkpill unknown" id="linkPill" role="status"><i class="dot"></i><span>Stato ignoto</span></span>
</div>
<div class="fl glass pill layers">
  <div class="seg" id="layers" role="group" aria-label="Layer visualizzato">
    <button data-l="auto" aria-pressed="true">Auto</button>
    <button data-l="1" aria-pressed="false">Layer 1</button>
    <button data-l="2" aria-pressed="false">Layer 2</button>
    <button data-l="3" aria-pressed="false">Layer 3</button>
  </div>
</div>
<div class="topright">
  <div class="fl glass pill ledcard" id="ledCard" role="button" tabindex="0" title="Cambia colore ed effetto dei LED" aria-label="Colore del LED per layer: apri le impostazioni">
    <span class="micro">LED</span>
    <span class="item" data-n="1"><i></i><span>L1</span></span>
    <span class="item" data-n="2"><i></i><span>L2</span></span>
    <span class="item" data-n="3"><i></i><span>L3</span></span>
  </div>
  <button class="cta" id="settingsBtn" type="button" aria-label="Impostazioni"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg><span>Impostazioni</span></button>
</div>
<div class="fl glass pill conncard">
  <span class="chip" id="chipBridge"><i class="dot"></i><span>Ponte</span></span>
  <span class="chip" id="chipProfile"><i class="dot"></i><span>Profilo</span></span>
  <span class="chip clickable" id="chipSend" role="button" tabindex="0"><i class="dot"></i><span>Pad</span></span>
</div>

<main class="stage" id="stage">
  <svg id="pad" viewBox="-30 -20 1400 1440" role="group" aria-label="Macropad: vista dall'alto"></svg>
</main>

<svg id="link" aria-hidden="true"><path d=""/><circle r="3.5" cx="-10" cy="-10"/></svg>
<div id="tags" aria-hidden="true"></div>

<aside class="card glass" id="inspector" hidden aria-label="Dettaglio controllo"></aside>

<div class="recents idle" id="last" role="status" aria-live="polite"></div>
<button class="fl glass pill textbtn" id="diagBtn" aria-expanded="false" aria-controls="diag" aria-label="Diagnostica"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Diagnostica</span></button>
<section class="sheet glass" id="send" hidden aria-label="Invio al macropad"></section>
<section class="sheet glass" id="leds" hidden aria-label="LED del macropad"></section>
<section class="sheet glass" id="settings" hidden aria-label="Impostazioni"></section>
<section class="sheet glass" id="diag" hidden aria-label="Diagnostica">
  <span class="micro">Diagnostica</span>
  <h3>Eventi grezzi</h3>
  <p id="diagHelp"></p>
  <pre id="raw">nessun evento</pre>
  <button type="button" class="btn" id="rawCopy">Copia</button>
</section>

<script src="protocol.js"></script>
<script src="live.js"></script>
</body>
</html>
